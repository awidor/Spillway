name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free disk space for the CUDA image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: ./dev.sh setup
      - run: ./dev.sh build
      - run: ./dev.sh package
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "Spillway $GITHUB_REF_NAME" --notes "" \
            out/release/spillway-linux-x86_64.tar.gz out/release/spillway-linux-x86_64.tar.gz.sha256 out/release/install.sh
