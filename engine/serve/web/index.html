<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Spillway</title>
<link rel="stylesheet" href="web/app.css">
</head>
<body>
<header class="top">
  <h1>Spillway</h1>
  <p class="state" id="state" role="status" aria-live="polite">Connecting</p>
</header>

<main>
  <section class="heat" aria-labelledby="h-heat">
    <div class="heat__head">
      <h2 id="h-heat">Experts</h2>
      <p class="heat__count" id="heat-count"></p>
    </div>
    <div class="heat__frame">
      <div class="heat__rows" aria-hidden="true"><span>layer 1</span><span>40</span></div>
      <canvas id="heat" role="img" aria-label="40 layers by 256 experts: in VRAM or in RAM, and how often each is routed"></canvas>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="heat__keys" aria-hidden="true">
      <span class="ramp ramp--vram"></span>in VRAM
      <span class="ramp ramp--ram"></span>in RAM
      <span class="heat__note">each layer sorted by routing, most used left</span>
    </div>
  </section>

  <section class="readouts" id="readouts" aria-label="Now"></section>

  <section class="charts">
    <figure class="chart chart--wide">
      <figcaption>Where each request's experts ran <span class="keys" id="k-src"></span></figcaption>
      <svg id="c-src" viewBox="0 0 640 220" role="img" aria-label="Expert sources and decode speed per request"></svg>
    </figure>
    <figure class="chart">
      <figcaption>VRAM</figcaption>
      <div class="split" id="c-vram"></div>
      <h3 class="sub">Tuning on this machine</h3>
      <div class="tune" id="c-tune"></div>
    </figure>
    <figure class="chart chart--wide">
      <figcaption>Last 60 seconds <span class="keys" id="k-live"></span></figcaption>
      <svg id="c-live" viewBox="0 0 640 220" preserveAspectRatio="none" role="img" aria-label="Decode speed, GPU, CPU and PCIe over the last minute"></svg>
    </figure>
    <figure class="chart">
      <figcaption>Decode speed by context</figcaption>
      <svg id="c-ctx" viewBox="0 0 400 220" role="img" aria-label="Decode tokens per second by context length"></svg>
    </figure>
  </section>
</main>
<script src="web/app.js"></script>
</body>
</html>
