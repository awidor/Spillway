<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spillway</title>
<link rel="stylesheet" href="web/tokens.css">
<link rel="stylesheet" href="web/components.css">
<link rel="stylesheet" href="web/app.css">
<script>
  try {
    const t = localStorage.getItem("strata.theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<header class="st-header">
  <span class="st-header__brand">Spillway</span>
  <span class="st-header__spacer"></span>
  <span class="st-pill" id="pill" data-state="idle" role="status" aria-live="polite">
    <span class="st-pill__dot"></span><span id="pill-text">&hellip;</span></span>
  <button class="st-btn st-btn--icon" id="theme-btn" aria-label="Light / dark">
    <svg class="st-icon"><use id="theme-icon" href="web/sprite.svg#i-moon"/></svg></button>
</header>

<main class="dash">
  <div class="tiles" id="tiles"></div>

  <div class="row row--2-1">
    <figure class="st-card panel">
      <figcaption>Experts per request <span class="legend" id="lg-src"></span></figcaption>
      <svg id="ch-src" viewBox="0 0 600 200" preserveAspectRatio="none" role="img" aria-label="Expert sources per request"></svg>
    </figure>
    <figure class="st-card panel">
      <figcaption>VRAM <span class="legend" id="lg-vram"></span></figcaption>
      <svg id="ch-vram" viewBox="0 0 300 200" role="img" aria-label="GPU memory"></svg>
    </figure>
  </div>

  <div class="row row--3">
    <figure class="st-card panel"><figcaption>tok/s × context</figcaption>
      <svg id="ch-ctx" viewBox="0 0 320 200" role="img" aria-label="Decode speed by context"></svg></figure>
    <figure class="st-card panel"><figcaption>tok/s × VRAM share</figcaption>
      <svg id="ch-hit" viewBox="0 0 320 200" role="img" aria-label="Decode speed by VRAM share"></svg></figure>
    <figure class="st-card panel"><figcaption>tok/s × drafts accepted</figcaption>
      <svg id="ch-draft" viewBox="0 0 320 200" role="img" aria-label="Decode speed by draft acceptance"></svg></figure>
  </div>

  <div class="row row--2">
    <figure class="st-card panel">
      <figcaption>Last 60 s <span class="legend" id="lg-live"></span></figcaption>
      <svg id="ch-live" viewBox="0 0 600 200" preserveAspectRatio="none" role="img" aria-label="Last minute"></svg>
    </figure>
    <figure class="st-card panel">
      <figcaption>Tuning</figcaption>
      <div class="bars" id="ch-tune"></div>
    </figure>
  </div>
</main>
<script src="web/app.js"></script>
</body>
</html>
